<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHURN INTELLIGENCE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #F4F4F0;
      color: #000000;
    }
    
    /* Strict Geometric Form Elements */
    .swiss-input {
      background-color: transparent;
      border: 2px solid #000;
      border-radius: 0;
      padding: 0.75rem;
      font-weight: 600;
      color: #000;
      outline: none;
      transition: background-color 0.1s;
    }
    .swiss-input:focus {
      background-color: #fff;
    }

    /* Brutalist Checkbox */
    input[type="checkbox"] {
      appearance: none;
      background-color: #F4F4F0;
      border: 2px solid #000;
      width: 1.5rem;
      height: 1.5rem;
      cursor: pointer;
      display: grid;
      place-content: center;
    }
    input[type="checkbox"]::before {
      content: "";
      width: 0.75rem;
      height: 0.75rem;
      background-color: #000;
      transform: scale(0);
      transition: 0.1s transform ease-in-out;
    }
    input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    /* Stark Slider */
    input[type="range"] {
      appearance: none;
      width: 100%;
      height: 4px;
      background: #000;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: #E60000;
      cursor: pointer;
      border-radius: 0;
    }

    /* Flat SVG Gauge */
    .gauge-ring-bg {
      stroke: #000;
    }
    .gauge-ring-fill {
      stroke: #E60000;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="min-h-screen antialiased p-6 sm:p-12">

  <main class="max-w-7xl mx-auto w-full">
    
    <!-- Massive Typographic Header -->
    <header class="mb-12 border-b-8 border-black pb-6 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <h1 class="text-5xl sm:text-7xl font-black uppercase tracking-tighter leading-none">
          Churn<br>Intelligence
        </h1>
        <p class="text-xl font-bold uppercase tracking-tight mt-4">Random Forest Prediction Pipeline</p>
      </div>
      
      <!-- Minimalist Preset Actions -->
      <div class="flex flex-col gap-2 font-bold uppercase text-sm tracking-wider">
        <span>Presets:</span>
        <button type="button" id="loadFlightRisk" class="text-left hover:text-[#E60000] hover:underline decoration-4 underline-offset-4">
          + High Risk (Fiber)
        </button>
        <button type="button" id="loadLoyal" class="text-left hover:text-[#E60000] hover:underline decoration-4 underline-offset-4">
          + Low Risk (2-Year)
        </button>
      </div>
    </header>

    <!-- Strict Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">

      <!-- LEFT: Form Input Grid (7 cols) -->
      <div class="lg:col-span-7 space-y-10">
        
        <!-- BLOCK 01 -->
        <section class="border-t-4 border-black pt-4">
          <h2 class="text-2xl font-black uppercase tracking-tighter mb-6">01. Economics</h2>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-bold uppercase tracking-wider">Contract Type</label>
              <select id="Contract" class="swiss-input">
                <option value="Month-to-month">Month-to-Month</option>
                <option value="One year">One Year</option>
                <option value="Two year">Two Year</option>
              </select>
            </div>

            <div class="flex flex-col gap-2">
              <div class="flex justify-between">
                <label class="text-sm font-bold uppercase tracking-wider">Tenure</label>
                <span id="tenureBadge" class="text-sm font-black">12 M</span>
              </div>
              <div class="pt-3">
                <input type="range" id="tenure" min="0" max="72" value="12">
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-bold uppercase tracking-wider">Monthly Bill</label>
              <input type="number" id="MonthlyCharges" step="0.5" value="75.00" class="swiss-input">
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-bold uppercase tracking-wider">Total Spend</label>
              <input type="number" id="TotalCharges" step="10" value="900.00" class="swiss-input">
            </div>

            <div class="flex flex-col gap-2 sm:col-span-2">
              <label class="text-sm font-bold uppercase tracking-wider">Payment Method</label>
              <select id="PaymentMethod" class="swiss-input">
                <option value="Electronic check">Electronic Check</option>
                <option value="Mailed check">Mailed Check</option>
                <option value="Bank transfer (automatic)">Bank Transfer</option>
                <option value="Credit card (automatic)">Credit Card</option>
              </select>
            </div>
          </div>
        </section>

        <!-- BLOCK 02 -->
        <section class="border-t-4 border-black pt-4">
          <h2 class="text-2xl font-black uppercase tracking-tighter mb-6">02. Services</h2>
          
          <div class="flex flex-col gap-2 mb-6">
            <label class="text-sm font-bold uppercase tracking-wider">Internet Provider</label>
            <select id="InternetService" class="swiss-input w-full">
              <option value="Fiber optic">Fiber Optic</option>
              <option value="DSL">DSL</option>
              <option value="No">None</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Security Suite</span>
              <input type="checkbox" id="check_security">
            </label>
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Tech Support</span>
              <input type="checkbox" id="check_support">
            </label>
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Cloud Backup</span>
              <input type="checkbox" id="check_backup">
            </label>
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Device Protect</span>
              <input type="checkbox" id="check_protection">
            </label>
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Streaming TV</span>
              <input type="checkbox" id="check_tv">
            </label>
            <label class="flex justify-between items-center border-2 border-black p-3 hover:bg-white cursor-pointer">
              <span class="font-bold uppercase text-sm">Streaming Movies</span>
              <input type="checkbox" id="check_movies">
            </label>
          </div>
        </section>

        <!-- BLOCK 03 -->
        <section class="border-t-4 border-black pt-4">
          <h2 class="text-2xl font-black uppercase tracking-tighter mb-6">03. Profile</h2>
          
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="flex flex-col gap-2">
              <label class="text-xs font-bold uppercase tracking-wider">Senior</label>
              <select id="SeniorCitizen" class="swiss-input p-2 text-sm">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-xs font-bold uppercase tracking-wider">Partner</label>
              <select id="Partner" class="swiss-input p-2 text-sm">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-xs font-bold uppercase tracking-wider">Dependents</label>
              <select id="Dependents" class="swiss-input p-2 text-sm">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-xs font-bold uppercase tracking-wider">Paperless</label>
              <select id="PaperlessBilling" class="swiss-input p-2 text-sm">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>
        </section>

        <input type="hidden" id="gender" value="Female">
        <input type="hidden" id="PhoneService" value="Yes">
        <input type="hidden" id="MultipleLines" value="No">

        <!-- Brutalist Submit Button -->
        <button type="button" id="submitBtn" class="w-full bg-black text-white font-black uppercase tracking-widest text-2xl py-6 hover:bg-[#E60000] hover:text-white transition-colors duration-200">
          Execute Prediction
        </button>
      </div>

      <!-- RIGHT: Output Space (5 cols) -->
      <div class="lg:col-span-5 flex flex-col h-full border-4 border-black bg-white">
        
        <div class="p-6 border-b-4 border-black flex justify-between items-end bg-[#F4F4F0]">
          <h2 class="text-2xl font-black uppercase tracking-tighter">Output</h2>
          <span id="riskBadge" class="font-bold uppercase tracking-widest text-sm px-3 py-1 border-2 border-black bg-white">IDLE</span>
        </div>

        <div class="flex-1 p-8 flex flex-col items-center justify-center relative overflow-hidden bg-white">
          <!-- Flat Geometric Gauge -->
          <div class="relative w-64 h-64 mb-8">
            <svg class="w-full h-full" viewBox="0 0 100 100">
              <circle class="gauge-ring-bg" stroke-width="12" fill="none" r="38" cx="50" cy="50" />
              <circle id="radialProgress" class="gauge-ring-fill" stroke-width="12" stroke-linecap="butt" fill="none" r="38" cx="50" cy="50" stroke-dasharray="238.76" stroke-dashoffset="238.76" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span id="probDisplay" class="text-4xl font-black tracking-tighter">--</span>
            </div>
          </div>

          <div class="text-center w-full">
            <span class="block text-sm font-bold uppercase tracking-widest mb-1">Classification</span>
            <span id="decisionLabel" class="block text-4xl font-black uppercase tracking-tighter">PENDING</span>
          </div>
        </div>

        <!-- Metric Table -->
        <div class="border-t-4 border-black bg-[#F4F4F0] p-6">
          <div class="space-y-4 font-bold text-sm uppercase">
            <div class="flex justify-between border-b-2 border-black pb-2">
              <span>Threshold</span>
              <span class="font-black text-lg">0.55</span>
            </div>
            <div class="pt-2">
              <span class="block mb-2 text-xs tracking-widest">Policy Recommendation</span>
              <p id="recContainer" class="text-base font-bold normal-case leading-tight">
                Awaiting input parameters to generate strategy.
              </p>
            </div>
          </div>
        </div>

        <div id="riskSignals" class="border-t-4 border-black bg-black text-white p-6 flex flex-wrap gap-2">
          <span class="uppercase font-bold text-sm">NO SIGNALS DETECTED</span>
        </div>

      </div>

    </div>
  </main>
  
  <script src="/static/script.js"></script>
</body>
</html>
